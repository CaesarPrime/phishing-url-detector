{% extends "base.html" %}
{% block title %}Login · Phishing URL Detector{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <div class="text-center mb-3">
          <i class="bi bi-shield-lock display-5 text-success"></i>
          <h1 class="h4 mt-2">User Login</h1>
          <p class="text-muted small">Sign in to scan website addresses</p>
        </div>
        <form method="post" novalidate>
          <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input class="form-control" id="username" name="username" required autofocus autocomplete="username">
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" name="password" type="password" required autocomplete="current-password">
          </div>
          <button class="btn btn-success w-100" type="submit">Login</button>
        </form>
        <p class="text-center small mt-3 mb-0">No account? <a href="{{ url_for('register') }}">Register here</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
